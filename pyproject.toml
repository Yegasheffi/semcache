[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semcache"
version = "1.0.0"
description = "Single-file semantic cache proxy for OpenAI-compatible chat completions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "semcache contributors" }]
keywords = ["llm", "semantic-cache", "proxy", "openai", "sqlite", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.20"]

[project.scripts]
semcache = "semcache:main"

[project.urls]
Homepage = "https://github.com/<owner>/semcache"

[tool.setuptools]
py-modules = ["semcache"]
